<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 64" role="img" aria-label="Nindova">
  <defs>
    <radialGradient id="logo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E0A64B" stop-opacity=".3"/>
      <stop offset=".62" stop-color="#E0A64B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .logo-glow { opacity: 0; animation: glow 7s ease-in-out infinite; }
    .diamond { opacity: 0; animation: stitch 7s steps(1, end) infinite; }
    .pair-one { animation-delay: 0s; }
    .pair-two { animation-delay: .35s; }
    .pair-three { animation-delay: .7s; }
    .pair-four { animation-delay: 1.05s; }
    .center { animation-delay: 1.6s; }
    @keyframes stitch { 0% { opacity: 0; } 6%, 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @keyframes glow { 0%, 100% { opacity: 0; } 55% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) {
      .diamond { animation: none; opacity: 1; }
      .logo-glow { animation: none; opacity: 0; }
    }
  </style>
