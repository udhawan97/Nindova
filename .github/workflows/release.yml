name: Publish tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Verify release identity
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          git merge-base --is-ancestor HEAD origin/main
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Verify and build root-hosted release
        run: npm run check
      - name: Package and verify downloads
        run: |
          mkdir release-assets
          cp dist/nindova.html "release-assets/nindova-$GITHUB_REF_NAME.html"
          (cd dist && zip -q -r "../release-assets/nindova-web-$GITHUB_REF_NAME.zip" .)
          cd release-assets
          sha256sum "nindova-$GITHUB_REF_NAME.html" "nindova-web-$GITHUB_REF_NAME.zip" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -tq "nindova-web-$GITHUB_REF_NAME.zip"
      - name: Publish release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(head -n 1 "docs/releases/$GITHUB_REF_NAME.md")
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --latest --title "${title#\# }" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
